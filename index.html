<!DOCTYPE html>
<html lang="ca">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Don't Lose Your Wings</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />
  <style>
    :root {
      --bg-page: #f5f5f4;
      --bg-card: #ffffff;
      --bg-subtle: #fafaf9;
      --text-main: #18181b;
      --text-secondary: #71717a;
      --border-line: #e4e4e7;
      --accent-dark: #18181b;
      --accent-hover: #27272a;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      background-color: var(--bg-page);
      color: var(--text-main);
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      -webkit-font-smoothing: antialiased;
    }

    .topbar {
      background-color: var(--bg-card);
      border-bottom: 1px solid var(--border-line);
      position: sticky;
      top: 0;
      z-index: 20;
    }

    .brand-mark {
      font-weight: 700;
      font-size: 1rem;
      letter-spacing: -0.02em;
      color: var(--text-main);
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 0.5rem;
    }

    .brand-dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background-color: var(--text-main);
      display: inline-block;
    }

    .surface {
      background-color: var(--bg-card);
      border: 1px solid var(--border-line);
      border-radius: 14px;
    }

    .surface-muted {
      background-color: var(--bg-subtle);
      border: 1px solid var(--border-line);
      border-radius: 10px;
    }

    .trip-item {
      transition: border-color 0.15s ease, background-color 0.15s ease;
    }

    .trip-item:hover {
      border-color: #a1a1aa;
      background-color: #ffffff;
    }

    .btn-primary-dark {
      background-color: var(--accent-dark);
      color: #ffffff;
      border: 1px solid var(--accent-dark);
      font-weight: 500;
      font-size: 0.875rem;
      padding: 0.5rem 1rem;
      border-radius: 9px;
    }

    .btn-primary-dark:hover {
      background-color: var(--accent-hover);
      border-color: var(--accent-hover);
      color: #ffffff;
    }

    .btn-ghost {
      background-color: transparent;
      color: var(--text-main);
      border: 1px solid var(--border-line);
      font-weight: 500;
      font-size: 0.875rem;
      padding: 0.5rem 0.9rem;
      border-radius: 9px;
    }

    .btn-ghost:hover {
      background-color: var(--bg-subtle);
      color: var(--text-main);
    }

    .btn-sm-clean {
      font-size: 0.8rem;
      padding: 0.35rem 0.7rem;
      border-radius: 8px;
      font-weight: 500;
    }

    .form-control,
    .form-select {
      border-color: var(--border-line);
      border-radius: 9px;
      font-size: 0.9rem;
      padding: 0.52rem 0.75rem;
      color: var(--text-main);
      background-color: #ffffff;
    }

    .form-control-sm,
    .form-select-sm {
      font-size: 0.84rem;
      padding: 0.42rem 0.65rem;
      border-radius: 8px;
    }

    .form-control:focus,
    .form-select:focus {
      border-color: var(--text-main);
      box-shadow: 0 0 0 3px rgba(24, 24, 27, 0.08);
    }

    .field-label {
      display: block;
      font-size: 0.78rem;
      font-weight: 500;
      color: #3f3f46;
      margin-bottom: 0.35rem;
    }

    .muted-copy {
      color: var(--text-secondary);
    }

    .cat-tag {
      font-size: 0.72rem;
      font-weight: 500;
      color: #3f3f46;
      background-color: #f4f4f5;
      border: 1px solid #e4e4e7;
      padding: 0.15rem 0.55rem;
      border-radius: 999px;
    }
  </style>
</head>
<body>
  <header class="topbar mb-4">
    <div class="container py-3 d-flex justify-content-between align-items-center" style="max-width: 960px;">
      <span class="brand-mark" id="brand-home">
        <span class="brand-dot"></span>
        <span>Don't Lose Your Wings</span>
      </span>

      <div id="nav-user" class="d-none align-items-center gap-2">
        <button id="btn-nav-admin" type="button" class="btn-ghost btn-sm-clean d-none">Administració</button>
        <span id="user-email" class="small muted-copy d-none d-md-inline me-1"></span>
        <button id="btn-logout" type="button" class="btn-ghost btn-sm-clean">Sortir</button>
      </div>
    </div>
  </header>

  <main class="container pb-5" style="max-width: 960px;">
    <div id="alert-box" class="alert d-none mb-4" role="alert" style="border-radius: 10px; font-size: 0.88rem;"></div>

    <!-- VISTA 1: AUTENTICACIÓ -->
    <section id="auth-view" class="surface p-4 p-md-5 mx-auto mt-4" style="max-width: 440px;">
      <h1 class="h5 fw-bold mb-1">Accedeix al teu espai</h1>
      <p class="small muted-copy mb-4">
        Tots els teus viatges, allotjaments i llocs en un sol lloc.
      </p>

      <div class="mb-3">
        <label for="auth-nom" class="field-label">Nom (només per registrar-se)</label>
        <input id="auth-nom" type="text" class="form-control" placeholder="Ex. Laia" />
      </div>
      <div class="mb-3">
        <label for="auth-email" class="field-label">Correu electrònic</label>
        <input id="auth-email" type="email" class="form-control" required placeholder="nom@exemple.cat" />
      </div>
      <div class="mb-4">
        <label for="auth-password" class="field-label">Contrasenya (mínim 8 caràcters)</label>
        <input id="auth-password" type="password" class="form-control" required minlength="8" placeholder="••••••••" />
      </div>

      <div class="d-flex gap-2">
        <button id="btn-login" type="button" class="btn-primary-dark flex-fill">Iniciar sessió</button>
        <button id="btn-register" type="button" class="btn-ghost flex-fill">Registrar-se</button>
      </div>
    </section>

    <!-- VISTA 2: ELS MEUS VIATGES -->
    <section id="app-view" class="d-none">
      <div class="d-flex flex-column flex-sm-row justify-content-between align-items-sm-center gap-3 mb-4">
        <div>
          <h1 id="welcome-title" class="h4 fw-bold mb-0">Hola!</h1>
          <p class="small muted-copy mb-0 mt-1">Els teus viatges actius i planificats.</p>
        </div>
        <button id="btn-toggle-form" type="button" class="btn-primary-dark">+ Nou viatge</button>
      </div>

      <div class="surface p-3 mb-4">
        <div class="row g-2 align-items-center">
          <div class="col-sm-9">
            <label for="search-destinacio" class="visually-hidden">Cerca per destinació</label>
            <input id="search-destinacio" type="text" class="form-control" placeholder="Filtrar per destinació..." />
          </div>
          <div class="col-sm-3 d-grid">
            <button id="btn-clear-search" type="button" class="btn-ghost">Netejar</button>
          </div>
        </div>
      </div>

      <div id="viatge-form-card" class="surface p-4 mb-4 d-none">
        <h2 id="form-title" class="h6 fw-bold mb-3">Nou viatge</h2>
        <form id="viatge-form" novalidate>
          <input type="hidden" id="viatge-id" />
          <div class="row g-3">
            <div class="col-md-6">
              <label for="viatge-titol" class="field-label">Títol</label>
              <input id="viatge-titol" type="text" class="form-control" maxlength="150" required placeholder="Ex. Lisboa amb la colla" />
            </div>
            <div class="col-md-6">
              <label for="viatge-destinacio" class="field-label">Destinació</label>
              <input id="viatge-destinacio" type="text" class="form-control" maxlength="150" required placeholder="Ex. Lisboa" />
            </div>
            <div class="col-md-6">
              <label for="viatge-data-inici" class="field-label">Data inicial</label>
              <input id="viatge-data-inici" type="date" class="form-control" required />
            </div>
            <div class="col-md-6">
              <label for="viatge-data-fi" class="field-label">Data final</label>
              <input id="viatge-data-fi" type="date" class="form-control" required />
            </div>
          </div>
          <div class="d-flex gap-2 mt-4">
            <button type="submit" class="btn-primary-dark">Desar viatge</button>
            <button id="btn-cancel-form" type="button" class="btn-ghost">Cancel·lar</button>
          </div>
        </form>
      </div>

      <div id="viatges-list" class="row g-3"></div>
    </section>

    <!-- VISTA 3: DETALL DEL VIATGE -->
    <section id="detail-view" class="d-none">
      <button id="btn-back-viatges" type="button" class="btn-ghost btn-sm-clean mb-3">
        ← Tornar
      </button>

      <div class="surface p-4 mb-4">
        <h1 id="detail-titol" class="h4 fw-bold mb-1"></h1>
        <p id="detail-meta" class="small muted-copy mb-3"></p>
        <div id="detail-resum" class="row g-3"></div>
      </div>

      <div class="row g-4">
        <div class="col-lg-6">
          <div class="surface p-4 h-100">
            <h2 class="h6 fw-bold mb-3">Allotjaments</h2>
            <form id="allotjament-form" class="mb-4 pb-3 border-bottom" style="border-color: var(--border-line) !important;">
              <div class="mb-2">
                <label for="allot-nom" class="field-label">Nom</label>
                <input id="allot-nom" type="text" class="form-control form-control-sm" required placeholder="Ex. Hotel Baixa" />
              </div>
              <div class="mb-2">
                <label for="allot-adreca" class="field-label">Adreça</label>
                <input id="allot-adreca" type="text" class="form-control form-control-sm" required placeholder="Ex. Rua Augusta 120" />
              </div>
              <div class="row g-2 mb-2">
                <div class="col-6">
                  <label for="allot-entrada" class="field-label">Entrada</label>
                  <input id="allot-entrada" type="date" class="form-control form-control-sm" required />
                </div>
                <div class="col-6">
                  <label for="allot-sortida" class="field-label">Sortida</label>
                  <input id="allot-sortida" type="date" class="form-control form-control-sm" required />
                </div>
              </div>
              <div class="mb-3">
                <label for="allot-preu" class="field-label">Preu total (€)</label>
                <input id="allot-preu" type="number" step="0.01" min="0" class="form-control form-control-sm" required value="0.00" />
              </div>
              <button type="submit" class="btn-primary-dark btn-sm-clean">+ Afegir allotjament</button>
            </form>
            <div id="allotjaments-list" class="d-flex flex-column gap-2"></div>
          </div>
        </div>

        <div class="col-lg-6">
          <div class="surface p-4 h-100">
            <h2 class="h6 fw-bold mb-3">Llocs per visitar</h2>
            <form id="lloc-form" class="mb-3 pb-3 border-bottom" style="border-color: var(--border-line) !important;">
              <div class="mb-2">
                <label for="lloc-nom" class="field-label">Nom del lloc</label>
                <input id="lloc-nom" type="text" class="form-control form-control-sm" required placeholder="Ex. Miradouro de Santa Luzia" />
              </div>
              <div class="mb-2">
                <label for="lloc-categoria" class="field-label">Categoria</label>
                <select id="lloc-categoria" class="form-select form-select-sm">
                  <option value="Cultura">Cultura</option>
                  <option value="Gastronomia">Gastronomia</option>
                  <option value="Natura">Natura</option>
                  <option value="Oci">Oci</option>
                  <option value="Altres">Altres</option>
                </select>
              </div>
              <div class="mb-3">
                <label for="lloc-notes" class="field-label">Notes</label>
                <textarea id="lloc-notes" rows="2" class="form-control form-control-sm" placeholder="Recomanacions, horaris..."></textarea>
              </div>
              <button type="submit" class="btn-primary-dark btn-sm-clean">+ Afegir lloc</button>
            </form>

            <div class="mb-3">
              <label for="filter-categoria" class="field-label">Categoria</label>
              <select id="filter-categoria" class="form-select form-select-sm">
                <option value="Totes">Totes les categories</option>
                <option value="Cultura">Cultura</option>
                <option value="Gastronomia">Gastronomia</option>
                <option value="Natura">Natura</option>
                <option value="Oci">Oci</option>
                <option value="Altres">Altres</option>
              </select>
            </div>

            <div id="llocs-list" class="d-flex flex-column gap-2"></div>
          </div>
        </div>
      </div>
    </section>

    <!-- VISTA 4: ADMINISTRACIÓ -->
    <section id="admin-view" class="d-none">
      <button id="btn-back-from-admin" type="button" class="btn-ghost btn-sm-clean mb-3">← Tornar</button>
      <div class="surface p-4">
        <h1 class="h5 fw-bold mb-1">Administració d’usuaris</h1>
        <p class="small muted-copy mb-4">Comptes registrats al sistema.</p>
        <div id="admin-users-list" class="d-flex flex-column gap-2"></div>
      </div>
    </section>
  </main>

  <script type="module">
    import { createClient } from 'https://esm.sh/@supabase/supabase-js@2';

    const SUPABASE_URL = 'https://dlhbjxkhwtxploxnkbxc.supabase.co';
    const SUPABASE_ANON_KEY = 'sb_publishable_AWirKMAydblzImSNJM8FHg_KzQujgZ_';

    const supabase = createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

    const authView = document.getElementById('auth-view');
    const appView = document.getElementById('app-view');
    const detailView = document.getElementById('detail-view');
    const adminView = document.getElementById('admin-view');
    const navUser = document.getElementById('nav-user');
    const btnNavAdmin = document.getElementById('btn-nav-admin');
    const userEmailEl = document.getElementById('user-email');
    const welcomeTitle = document.getElementById('welcome-title');
    const alertBox = document.getElementById('alert-box');
    const viatgesList = document.getElementById('viatges-list');
    const formCard = document.getElementById('viatge-form-card');
    const viatgeForm = document.getElementById('viatge-form');
    const formTitle = document.getElementById('form-title');
    const searchInput = document.getElementById('search-destinacio');
    const filterCategoria = document.getElementById('filter-categoria');

    let currentSession = null;
    let currentRole = 'usuari';
    let activeViatgeId = null;
    let activeLlocsCache = [];

    function showAlert(message, type = 'danger') {
      alertBox.textContent = message;
      alertBox.className = `alert alert-${type} mb-4`;
      window.scrollTo({ top: 0, behavior: 'smooth' });
    }

    function hideAlert() {
      alertBox.className = 'alert d-none mb-4';
      alertBox.textContent = '';
    }

    function showView(viewName) {
      authView.classList.add('d-none');
      appView.classList.add('d-none');
      detailView.classList.add('d-none');
      adminView.classList.add('d-none');
      if (viewName === 'auth') authView.classList.remove('d-none');
      if (viewName === 'app') appView.classList.remove('d-none');
      if (viewName === 'detail') detailView.classList.remove('d-none');
      if (viewName === 'admin') adminView.classList.remove('d-none');
    }

    async function refreshUserRole() {
      if (!currentSession?.user) {
        currentRole = 'usuari';
        btnNavAdmin.classList.add('d-none');
        return;
      }
      const { data } = await supabase
        .from('profiles')
        .select('rol')
        .eq('id', currentSession.user.id)
        .single();
      currentRole = data?.rol || 'usuari';
      if (currentRole === 'admin') {
        btnNavAdmin.classList.remove('d-none');
      } else {
        btnNavAdmin.classList.add('d-none');
      }
    }

    function openForm(viatge = null) {
      hideAlert();
      formCard.classList.remove('d-none');
      if (viatge) {
        formTitle.textContent = 'Editar viatge';
        document.getElementById('viatge-id').value = viatge.id;
        document.getElementById('viatge-titol').value = viatge.titol;
        document.getElementById('viatge-destinacio').value = viatge.destinacio;
        document.getElementById('viatge-data-inici').value = viatge.data_inicial;
        document.getElementById('viatge-data-fi').value = viatge.data_final;
      } else {
        formTitle.textContent = 'Nou viatge';
        viatgeForm.reset();
        document.getElementById('viatge-id').value = '';
      }
    }

    function closeForm() {
      formCard.classList.add('d-none');
      viatgeForm.reset();
      document.getElementById('viatge-id').value = '';
    }

    async function apiRequest(method, path, body = null) {
      const token = currentSession?.access_token;
      if (!token) throw new Error('Cal iniciar sessió.');

      const opts = {
        method,
        headers: {
          Authorization: `Bearer ${token}`,
          'Content-Type': 'application/json'
        }
      };
      if (body) opts.body = JSON.stringify(body);

      const resp = await fetch(path, opts);
      const data = await resp.json().catch(() => ({}));
      if (!resp.ok) throw new Error(data.error || 'S’ha produït un error en la petició.');
      return data;
    }

    function renderViatges(items) {
      viatgesList.innerHTML = '';

      if (!items.length) {
        viatgesList.innerHTML = `
          <div class="col-12">
            <div class="surface p-5 text-center muted-copy">
              Encara no hi ha cap viatge. Crea’n un amb <strong>+ Nou viatge</strong>.
            </div>
          </div>`;
        return;
      }

      for (const v of items) {
        const col = document.createElement('div');
        col.className = 'col-md-6';

        const card = document.createElement('div');
        card.className = 'surface trip-item p-4 h-100 d-flex flex-column';

        const title = document.createElement('h3');
        title.className = 'h6 fw-bold mb-1';
        title.textContent = v.titol;

        const meta = document.createElement('p');
        meta.className = 'small muted-copy mb-3';
        meta.textContent = `${v.destinacio} · ${v.data_inicial} → ${v.data_final}`;

        const actions = document.createElement('div');
        actions.className = 'd-flex flex-wrap gap-2 mt-auto pt-2';

        const btnView = document.createElement('button');
        btnView.type = 'button';
        btnView.className = 'btn-primary-dark btn-sm-clean';
        btnView.textContent = 'Obrir';
        btnView.addEventListener('click', () => openDetail(v.id));

        const btnEdit = document.createElement('button');
        btnEdit.type = 'button';
        btnEdit.className = 'btn-ghost btn-sm-clean';
        btnEdit.textContent = 'Editar';
        btnEdit.addEventListener('click', () => openForm(v));

        const btnDelete = document.createElement('button');
        btnDelete.type = 'button';
        btnDelete.className = 'btn btn-sm btn-outline-danger btn-sm-clean';
        btnDelete.textContent = 'Eliminar';
        btnDelete.addEventListener('click', () => deleteViatge(v));

        actions.append(btnView, btnEdit, btnDelete);
        card.append(title, meta, actions);
        col.append(card);
        viatgesList.append(col);
      }
    }

    async function loadViatges() {
      try {
        const filtro = encodeURIComponent(searchInput.value.trim());
        const query = filtro ? `?destinacio=${filtro}` : '';
        const items = await apiRequest('GET', `/api/viatges${query}`);
        renderViatges(items);
      } catch (err) {
        showAlert(err.message);
      }
    }

    async function deleteViatge(viatge) {
      hideAlert();
      const confirmed = window.confirm(`Segur que vols eliminar el viatge "${viatge.titol}"? També s’eliminaran els seus allotjaments i llocs.`);
      if (!confirmed) return;

      try {
        await apiRequest('DELETE', `/api/viatges?id=${encodeURIComponent(viatge.id)}`);
        showAlert('Viatge eliminat correctament.', 'success');
        await loadViatges();
      } catch (err) {
        showAlert(err.message);
      }
    }

    function renderLlocsFiltered() {
      const container = document.getElementById('llocs-list');
      container.innerHTML = '';
      const cat = filterCategoria.value;
      const items = cat === 'Totes'
        ? activeLlocsCache
        : activeLlocsCache.filter((l) => l.categoria === cat);

      if (!items.length) {
        container.innerHTML = '<p class="small muted-copy mb-0">Cap lloc en aquesta categoria.</p>';
        return;
      }

      for (const l of items) {
        const box = document.createElement('div');
        box.className = 'surface-muted p-3';

        const header = document.createElement('div');
        header.className = 'd-flex justify-content-between align-items-start gap-2';

        const info = document.createElement('div');
        const topLine = document.createElement('div');
        topLine.className = 'd-flex align-items-center gap-2 flex-wrap';

        const nameEl = document.createElement('span');
        nameEl.className = 'fw-semibold small';
        nameEl.textContent = l.nom_lloc;

        const badge = document.createElement('span');
        badge.className = 'cat-tag';
        badge.textContent = l.categoria;

        topLine.append(nameEl, badge);
        info.append(topLine);

        if (l.notes) {
          const notesEl = document.createElement('div');
          notesEl.className = 'small muted-copy mt-1';
          notesEl.textContent = l.notes;
          info.append(notesEl);
        }

        const btnDel = document.createElement('button');
        btnDel.type = 'button';
        btnDel.className = 'btn btn-sm btn-outline-danger btn-sm-clean';
        btnDel.textContent = 'Eliminar';
        btnDel.addEventListener('click', async () => {
          hideAlert();
          try {
            await apiRequest('DELETE', `/api/detall?recurs=lloc&id=${encodeURIComponent(l.id)}`);
            showAlert('Lloc eliminat correctament.', 'success');
            await openDetail(activeViatgeId);
          } catch (err) {
            showAlert(err.message);
          }
        });

        header.append(info, btnDel);
        box.append(header);
        container.append(box);
      }
    }

    async function openDetail(viatgeId) {
      hideAlert();
      activeViatgeId = viatgeId;
      try {
        const data = await apiRequest('GET', `/api/detall?viatge_id=${encodeURIComponent(viatgeId)}`);
        showView('detail');

        document.getElementById('detail-titol').textContent = data.viatge.titol;
        document.getElementById('detail-meta').textContent =
          `${data.viatge.destinacio} · ${data.viatge.data_inicial} → ${data.viatge.data_final}`;

        const catsText = Object.entries(data.resum.llocs_per_categoria || {})
          .map(([k, v]) => `${k}: ${v}`)
          .join(', ') || 'Cap';

        document.getElementById('detail-resum').innerHTML = `
          <div class="col-sm-4">
            <div class="surface-muted p-3 h-100">
              <div class="small muted-copy">Nits</div>
              <div class="fw-bold fs-6 mt-1">${data.resum.nits_viatge}</div>
            </div>
          </div>
          <div class="col-sm-4">
            <div class="surface-muted p-3 h-100">
              <div class="small muted-copy">Cost allotjaments</div>
              <div class="fw-bold fs-6 mt-1">${data.resum.cost_total_allotjament.toFixed(2)} €</div>
            </div>
          </div>
          <div class="col-sm-4">
            <div class="surface-muted p-3 h-100">
              <div class="small muted-copy">Llocs (${data.resum.total_llocs})</div>
              <div class="fw-semibold small mt-1">${catsText}</div>
            </div>
          </div>
        `;

        const allotList = document.getElementById('allotjaments-list');
        allotList.innerHTML = '';
        if (!data.allotjaments.length) {
          allotList.innerHTML = '<p class="small muted-copy mb-0">Cap allotjament registrat.</p>';
        } else {
          for (const a of data.allotjaments) {
            const box = document.createElement('div');
            box.className = 'surface-muted p-3 d-flex justify-content-between align-items-start gap-2';

            const info = document.createElement('div');
            info.className = 'small';
            const nEl = document.createElement('div');
            nEl.className = 'fw-semibold';
            nEl.textContent = `${a.nom} · ${Number(a.preu).toFixed(2)} €`;
            const dEl = document.createElement('div');
            dEl.className = 'muted-copy mt-1';
            dEl.textContent = `${a.adreca} (${a.data_entrada} → ${a.data_sortida})`;
            info.append(nEl, dEl);

            const btnDel = document.createElement('button');
            btnDel.type = 'button';
            btnDel.className = 'btn btn-sm btn-outline-danger btn-sm-clean';
            btnDel.textContent = 'Eliminar';
            btnDel.addEventListener('click', async () => {
              hideAlert();
              if (!window.confirm(`Eliminar l’allotjament "${a.nom}"?`)) return;
              try {
                await apiRequest('DELETE', `/api/detall?recurs=allotjament&id=${encodeURIComponent(a.id)}`);
                showAlert('Allotjament eliminat correctament.', 'success');
                await openDetail(activeViatgeId);
              } catch (err) {
                showAlert(err.message);
              }
            });

            box.append(info, btnDel);
            allotList.append(box);
          }
        }

        activeLlocsCache = data.llocs || [];
        renderLlocsFiltered();
      } catch (err) {
        showAlert(err.message);
      }
    }

    async function openAdmin() {
      hideAlert();
      try {
        const users = await apiRequest('GET', '/api/admin');
        showView('admin');
        const listEl = document.getElementById('admin-users-list');
        listEl.innerHTML = '';

        for (const u of users) {
          const row = document.createElement('div');
          row.className = 'surface-muted p-3 d-flex justify-content-between align-items-center gap-2';

          const info = document.createElement('div');
          const nameEl = document.createElement('div');
          nameEl.className = 'fw-semibold small';
          nameEl.textContent = `${u.nom} · ${u.rol}`;
          const mailEl = document.createElement('div');
          mailEl.className = 'small muted-copy';
          mailEl.textContent = u.email;
          info.append(nameEl, mailEl);

          row.append(info);

          if (u.id !== currentSession.user.id) {
            const btnDel = document.createElement('button');
            btnDel.type = 'button';
            btnDel.className = 'btn btn-sm btn-outline-danger btn-sm-clean';
            btnDel.textContent = 'Eliminar compte';
            btnDel.addEventListener('click', async () => {
              hideAlert();
              if (!window.confirm(`Segur que vols eliminar el compte de ${u.email}?`)) return;
              try {
                await apiRequest('DELETE', `/api/admin?id=${encodeURIComponent(u.id)}`);
                showAlert('Compte eliminat correctament.', 'success');
                await openAdmin();
              } catch (err) {
                showAlert(err.message);
              }
            });
            row.append(btnDel);
          }

          listEl.append(row);
        }
      } catch (err) {
        showAlert(err.message);
      }
    }

    document.getElementById('allotjament-form').addEventListener('submit', async (e) => {
      e.preventDefault();
      hideAlert();
      try {
        await apiRequest('POST', '/api/detall', {
          recurs: 'allotjament',
          viatge_id: activeViatgeId,
          nom: document.getElementById('allot-nom').value.trim(),
          adreca: document.getElementById('allot-adreca').value.trim(),
          data_entrada: document.getElementById('allot-entrada').value,
          data_sortida: document.getElementById('allot-sortida').value,
          preu: document.getElementById('allot-preu').value
        });
        e.target.reset();
        document.getElementById('allot-preu').value = '0.00';
        showAlert('Allotjament afegit correctament.', 'success');
        await openDetail(activeViatgeId);
      } catch (err) {
        showAlert(err.message);
      }
    });

    document.getElementById('lloc-form').addEventListener('submit', async (e) => {
      e.preventDefault();
      hideAlert();
      try {
        await apiRequest('POST', '/api/detall', {
          recurs: 'lloc',
          viatge_id: activeViatgeId,
          nom_lloc: document.getElementById('lloc-nom').value.trim(),
          categoria: document.getElementById('lloc-categoria').value,
          notes: document.getElementById('lloc-notes').value.trim()
        });
        e.target.reset();
        showAlert('Lloc afegit correctament.', 'success');
        await openDetail(activeViatgeId);
      } catch (err) {
        showAlert(err.message);
      }
    });

    filterCategoria.addEventListener('change', renderLlocsFiltered);
    btnNavAdmin.addEventListener('click', openAdmin);
    document.getElementById('btn-back-from-admin').addEventListener('click', () => {
      hideAlert();
      showView('app');
      loadViatges();
    });

    document.getElementById('btn-back-viatges').addEventListener('click', () => {
      hideAlert();
      activeViatgeId = null;
      showView('app');
      loadViatges();
    });

    document.getElementById('brand-home').addEventListener('click', () => {
      if (currentSession?.user) {
        hideAlert();
        activeViatgeId = null;
        showView('app');
        loadViatges();
      }
    });

    viatgeForm.addEventListener('submit', async (e) => {
      e.preventDefault();
      hideAlert();

      const id = document.getElementById('viatge-id').value;
      const titol = document.getElementById('viatge-titol').value.trim();
      const destinacio = document.getElementById('viatge-destinacio').value.trim();
      const data_inicial = document.getElementById('viatge-data-inici').value;
      const data_final = document.getElementById('viatge-data-fi').value;

      if (!titol || !destinacio || !data_inicial || !data_final) {
        return showAlert('Cal omplir tots els camps del viatge.');
      }
      if (data_final < data_inicial) {
        return showAlert('La data final ha de ser igual o posterior a la data inicial.');
      }

      try {
        if (id) {
          await apiRequest('PUT', '/api/viatges', { id, titol, destinacio, data_inicial, data_final });
          showAlert('Viatge actualitzat correctament.', 'success');
        } else {
          await apiRequest('POST', '/api/viatges', { titol, destinacio, data_inicial, data_final });
          showAlert('Viatge creat correctament.', 'success');
        }
        closeForm();
        await loadViatges();
      } catch (err) {
        showAlert(err.message);
      }
    });

    document.getElementById('btn-toggle-form').addEventListener('click', () => openForm());
    document.getElementById('btn-cancel-form').addEventListener('click', closeForm);
    searchInput.addEventListener('input', () => loadViatges());
    document.getElementById('btn-clear-search').addEventListener('click', () => {
      searchInput.value = '';
      loadViatges();
    });

    async function updateUI(session) {
      currentSession = session;
      if (session?.user) {
        await refreshUserRole();
        showView('app');
        navUser.classList.remove('d-none');
        navUser.classList.add('d-flex');
        userEmailEl.textContent = session.user.email;
        const nom = session.user.user_metadata?.full_name || session.user.email.split('@')[0];
        welcomeTitle.textContent = `Hola, ${nom}!`;
        loadViatges();
      } else {
        currentRole = 'usuari';
        btnNavAdmin.classList.add('d-none');
        navUser.classList.add('d-none');
        navUser.classList.remove('d-flex');
        showView('auth');
        userEmailEl.textContent = '';
        closeForm();
      }
    }

    document.getElementById('btn-register').addEventListener('click', async () => {
      hideAlert();
      const nom = document.getElementById('auth-nom').value.trim();
      const email = document.getElementById('auth-email').value.trim();
      const password = document.getElementById('auth-password').value;

      if (password.length < 8) {
        return showAlert('La contrasenya ha de tenir com a mínim 8 caràcters.');
      }

      const { error } = await supabase.auth.signUp({
        email,
        password,
        options: { data: { full_name: nom || email.split('@')[0] } }
      });

      if (error) return showAlert(error.message);
      showAlert('Registre completat! Ja pots iniciar sessió.', 'success');
    });

    document.getElementById('btn-login').addEventListener('click', async () => {
      hideAlert();
      const email = document.getElementById('auth-email').value.trim();
      const password = document.getElementById('auth-password').value;

      const { data, error } = await supabase.auth.signInWithPassword({ email, password });
      if (error) return showAlert('Credencials incorrectes o compte no verificat.');
      await updateUI(data.session);
    });

    document.getElementById('btn-logout').addEventListener('click', async () => {
      hideAlert();
      await supabase.auth.signOut();
      await updateUI(null);
    });

    const { data: { session } } = await supabase.auth.getSession();
    await updateUI(session);

    supabase.auth.onAuthStateChange(async (_event, currentSession) => {
      await updateUI(currentSession);
    });
  </script>
</body>
</html>
